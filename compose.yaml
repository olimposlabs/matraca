name: matraca-secure-db
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matraca_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-bootstrap
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54339:5432"
    volumes:
      - matraca-postgres:/var/lib/postgresql/data
    secrets:
      - source: postgres-bootstrap
        target: postgres-bootstrap
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "matraca_bootstrap", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
secrets:
  postgres-bootstrap:
    file: "${MATRACA_POSTGRES_BOOTSTRAP_FILE:?execute npm run db:start}"
volumes:
  matraca-postgres:
