name: matraca
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matraca
      POSTGRES_PASSWORD: matraca-local-only
      POSTGRES_DB: matraca
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - matraca-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matraca -d matraca"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  matraca-postgres:
